name: build-and-push

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一分支并发时取消旧运行，避免两个 push 互相覆盖 latest 与 kustomization。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 1) 质量门禁：构建之前必须先通过静态检查与单元测试。
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, order-service]
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 准备 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: ${{ matrix.service }}/go.sum
      - name: 静态检查与单元测试
        working-directory: ${{ matrix.service }}
        run: |
          go vet ./...
          go test -race ./...

  # 2) 构建：PR 只构建不推送（fork 的 PR 读不到 secrets）。
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, order-service]
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3
      - name: 登录 Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            hefangbing/${{ matrix.service }}:latest
            hefangbing/${{ matrix.service }}:${{ github.sha }}

  # 3) 把新镜像的 SHA 写回 git：git 是镜像版本的唯一事实源。
  #    集群侧由 Argo CD / Flux 同步，或本地执行 kubectl apply -k k8s/。
  #    （GITHUB_TOKEN 产生的 push 不会再触发 workflow，因此不会循环。）
  update-manifests:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: 安装 Kustomize
        uses: imranismail/setup-kustomize@v2
      - name: 更新镜像 tag 为 commit SHA
        working-directory: k8s
        run: |
          kustomize edit set image hefangbing/user-service=hefangbing/user-service:${{ github.sha }}
          kustomize edit set image hefangbing/order-service=hefangbing/order-service:${{ github.sha }}
      - name: 提交回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          if git diff --staged --quiet; then
            echo "no image tag change"
          else
            git commit -m "chore: update image tags to ${{ github.sha }}"
            git push
          fi
