apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: user-service
  labels:
    release: monitoring   # 关键：不写这行 Prometheus 不会抓
spec:
  namespaceSelector:
    matchNames:
    - default
  selector:
    matchLabels:
      app: user-service
  endpoints:
  - targetPort: 8080
    path: /metrics
    interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: order-service
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
    - default
  selector:
    matchLabels:
      app: order-service
  endpoints:
  - targetPort: 8080
    path: /metrics
    interval: 15s
